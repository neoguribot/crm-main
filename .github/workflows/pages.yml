name: Deploy landing page to GitHub Pages

# site/ 아래 정적 소개 페이지만 배포한다. Next.js 앱은 배포하지 않는다.
on:
  push:
    branches: [migrate/nextjs, main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages 가 아직 켜져 있지 않으면 워크플로가 직접 켠다.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
